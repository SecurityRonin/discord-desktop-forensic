[package]
name = "discord-desktop-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
categories.workspace = true
# Published library: a deliberately LOW, CI-verified MSRV floor.
rust-version = "1.80"
description = "Discord desktop (Electron/Chromium) artifact reader — interprets the Local Storage LevelDB account identity, recent channels/guilds, and the auth 'token' record (redacted by default) on top of the Chromium storage readers. Panic-free, fuzzed."
documentation = "https://docs.rs/discord-desktop-core"
keywords = ["forensics", "discord", "dfir", "chromium", "leveldb"]

[lib]
name = "discord_desktop_core"
path = "src/lib.rs"

[dependencies]
forensicnomicon-core = { workspace = true }
chromium-storage-localstorage = { workspace = true }
leveldb-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
rusty-leveldb = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
