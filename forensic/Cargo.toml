[package]
name = "discord-desktop-forensic"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
categories.workspace = true
rust-version = "1.87"
description = "Discord desktop forensic analyzer — audits the account/token/recent artifacts read by discord-desktop-core and emits normalized forensicnomicon findings (flags the auth token as a sensitive credential, surfacing its presence and location, not the secret). Panic-free, fuzzed."
documentation = "https://docs.rs/discord-desktop-forensic"
keywords = ["forensics", "discord", "dfir", "credential", "chromium"]

[lib]
name = "discord_desktop_forensic"
path = "src/lib.rs"

[dependencies]
discord-desktop-core = { workspace = true }
forensicnomicon-core = { workspace = true }

[dev-dependencies]
rusty-leveldb = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
